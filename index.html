<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#7b1e1e,#b85c5c);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

h1{
    margin-bottom:15px;
}

.game{
    position:relative;
    width:306px;
    height:306px;
}

.board{
    position:absolute;
    top:0;
    left:0;
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:3px;
    z-index:1;
}

.cell{
    width:100px;
    height:100px;
    background:linear-gradient(135deg,#d8a25e,#b97a3d,#8b5a2b);
    border:2px solid #6d3f1d;
    color:#2b1205;
    font-size:55px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    border-radius:8px;
    user-select:none;
    box-shadow:
        inset 0 2px 6px rgba(255,255,255,.35),
        inset 0 -4px 8px rgba(0,0,0,.25),
        0 4px 8px rgba(0,0,0,.4);
   transition:0.3s ease;
}

.cell:hover{
    background:linear-gradient(135deg,#ffe0a3,#f3b96b,#c98745);
    transform:scale(1.05);
    /* border-color:#ffd700; */

    /* box-shadow:
        0 0 15px rgba(255,220,120,0.9),
        inset 0 2px 8px rgba(255,255,255,.6); */
}

#line{
    position:absolute;
    top:0;
    left:0;
    width:306px;
    height:306px;
    z-index:2;
    pointer-events:none;
}

#status{
    margin-top:20px;
    font-size:22px;
}

button{
    margin-top:15px;
    padding:10px 30px;
    font-size:18px;
    border:none;
    border-radius:8px;
    background:#00c853;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#009624;
}
</style>
</head>

<body>

<h1>🎮 Tic Tac Toe</h1>

<div class="game">

<canvas id="line" width="306" height="306"></canvas>

<div class="board" id="board"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>

</div>


<div id="status">
Your Turn (X)
</div>

<button onclick="resetGame()">
Restart
</button>


<script>

const boardDiv=document.getElementById("board");
const status=document.getElementById("status");

const canvas=document.getElementById("line");
const ctx=canvas.getContext("2d");


let board=[
"",
"",
"",
"",
"",
"",
"",
"",
""
];


let gameOver=false;


const winPatterns=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];



function createBoard(){

boardDiv.innerHTML="";


board.forEach((value,index)=>{


let cell=document.createElement("div");

cell.className="cell";

cell.innerHTML=value;


cell.onclick=()=>playerMove(index);


boardDiv.appendChild(cell);


});


}



function playerMove(index){


if(board[index]!=="" || gameOver)
return;


board[index]="X";


createBoard();



if(checkWinner()){

status.innerHTML="🎉 You Win!";

gameOver=true;

return;

}



if(!board.includes("")){

status.innerHTML="🤝 Draw!";

gameOver=true;

return;

}



status.innerHTML="🤖 Computer Thinking...";


setTimeout(computerMove,500);


}

function computerMove(){

if(gameOver) return;


// Computer (O) ki move

let bestMove=getBestMove();


board[bestMove]="O";


createBoard();



if(checkWinner()){

status.innerHTML="🤖 Computer Wins!";

gameOver=true;

return;

}



if(!board.includes("")){

status.innerHTML="🤝 Draw!";

gameOver=true;

return;

}


status.innerHTML="Your Turn (X)";

}



// Smart AI (Minimax)

function getBestMove(){


let bestScore=-Infinity;

let move;


for(let i=0;i<board.length;i++){


if(board[i]==""){


board[i]="O";


let score=minimax(false);


board[i]="";


if(score>bestScore){

bestScore=score;

move=i;

}


}

}


return move;

}



function minimax(isMaximizing){



if(checkAIWinner("O"))
return 1;


if(checkAIWinner("X"))
return -1;



if(!board.includes(""))
return 0;



if(isMaximizing){


let bestScore=-Infinity;


for(let i=0;i<9;i++){


if(board[i]==""){


board[i]="O";


let score=minimax(false);


board[i]="";


bestScore=Math.max(score,bestScore);


}

}


return bestScore;



}else{


let bestScore=Infinity;


for(let i=0;i<9;i++){


if(board[i]==""){


board[i]="X";


let score=minimax(true);


board[i]="";


bestScore=Math.min(score,bestScore);


}

}


return bestScore;

}


}




function checkAIWinner(player){


for(let pattern of winPatterns){


let [a,b,c]=pattern;


if(
board[a]==player &&
board[b]==player &&
board[c]==player
){

return true;

}

}


return false;

}





function checkWinner(){


for(let pattern of winPatterns){


let [a,b,c]=pattern;



if(
board[a] &&
board[a]==board[b] &&
board[a]==board[c]
){


drawWinningLine(pattern);


return true;


}


}


return false;


}

function drawWinningLine(pattern){

const pos=[

[50,50],
[153,50],
[256,50],

[50,153],
[153,153],
[256,153],

[50,256],
[153,256],
[256,256]

];



let start=pos[pattern[0]];

let end=pos[pattern[2]];



ctx.clearRect(0,0,306,306);



ctx.beginPath();

ctx.moveTo(start[0],start[1]);

ctx.lineTo(end[0],end[1]);



ctx.strokeStyle="red";

ctx.lineWidth=8;

ctx.lineCap="round";

ctx.stroke();



}




function resetGame(){


board=[
"",
"",
"",
"",
"",
"",
"",
"",
""
];


gameOver=false;


ctx.clearRect(0,0,306,306);


status.innerHTML="Your Turn (X)";


createBoard();


}



createBoard();

</script>
